<style>
  .whatsapp-float {
    width: 60px;
    height: 60px;
    background-color: #25d366;
    color: #fff;
    border-radius: 50px;
    text-align: center;
    font-size: 30px;
    box-shadow: 0 6px 22px rgba(37, 211, 102, 0.4);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.2s;
  }
  .whatsapp-float:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
  }
  .whatsapp-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background-color: #ef4444;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 4px;
    margin-bottom: 2px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    animation: wa-badge-fade 4s ease-in-out infinite;
  }
  .whatsapp-pulse {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50px;
    background-color: #25d366;
    animation: wa-pulse-anim 2s ease-out infinite;
  }
  @keyframes wa-pulse-anim {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  @keyframes wa-badge-fade {
    0%, 70% { opacity: 1; }
    85% { opacity: 0; }
    100% { opacity: 1; }
  }
  .wa-menu.show { display: flex; animation: wa-slide-up .25s ease-out; }
  @keyframes wa-slide-up {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 576px) {
    #waContainer { bottom: 18px; right: 18px; }
    .whatsapp-float { width: 52px; height: 52px; font-size: 26px; }
    .whatsapp-badge { font-size: 9px; padding: 3px 8px; top: -6px; right: -6px; }
    .wa-menu a { font-size: .82rem; padding: 8px 14px; }
  }
</style>

<script>
  (function() {
    var container = document.getElementById('waContainer');
    var toggle = document.getElementById('waToggle');
    var menu = document.getElementById('waMenu');

    toggle.addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.toggle('hidden');
      menu.classList.toggle('flex');
      menu.classList.toggle('show');
    });

    document.addEventListener('click', function(e) {
      if (!container.contains(e.target)) {
        menu.classList.add('hidden');
        menu.classList.remove('flex', 'show');
      }
    });
  })();
</script>
