{# Uso: tab_empleos_activo = "buscar" | "guardados" | "ocultas" #}
{% url 'empleos_app:buscar-empleo' as url_buscar %}
{% url 'empleos_app:empleos-guardados' as url_guardados %}
{% url 'empleos_app:ofertas-ocultas' as url_ocultas %}

<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-3">
  <div>
    <h1 class="text-2xl font-bold text-slate-800">
      <i class="fas {{ icono_empleos }} mr-2 {{ color_icono_empleos }}"></i>{{ titulo_empleos }}
    </h1>
  </div>
  <nav class="inline-flex self-start sm:self-auto rounded-xl bg-slate-100 p-1 gap-1" aria-label="Secciones de empleos">
    <a href="{{ url_buscar }}"
       class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-lg transition {% if tab_empleos_activo == 'buscar' %}bg-blue-600 text-white shadow{% else %}text-slate-600 hover:bg-white hover:text-slate-800{% endif %}"
       title="Buscar empleos">
      <i class="fas fa-search"></i>
      <span class="hidden sm:inline ml-1.5">Buscar</span>
    </a>
    <a href="{{ url_guardados }}"
       class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-lg transition {% if tab_empleos_activo == 'guardados' %}bg-blue-600 text-white shadow{% else %}text-slate-600 hover:bg-white hover:text-slate-800{% endif %}"
       title="Empleos guardados">
      <i class="fas fa-bookmark"></i>
      <span class="hidden sm:inline ml-1.5">Guardados</span>
    </a>
    <a href="{{ url_ocultas }}"
       class="inline-flex items-center px-3 py-2 text-sm font-medium rounded-lg transition {% if tab_empleos_activo == 'ocultas' %}bg-blue-600 text-white shadow{% else %}text-slate-600 hover:bg-white hover:text-slate-800{% endif %}"
       title="Ofertas ocultas">
      <i class="fas fa-eye-slash"></i>
      <span class="hidden sm:inline ml-1.5">Ocultas</span>
    </a>
  </nav>
</div>
