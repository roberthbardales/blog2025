{% extends "layout_sidebar.html" %}

{% block title %}Buscar Empleos{% endblock title %}

{% block sidebar_content %}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-800">
      <i class="fas fa-search mr-2 text-blue-600"></i>Buscar Empleos
    </h1>
    <div class="flex items-center gap-3">
      <a href="{% url 'empleos_app:ofertas-ocultas' %}"
         class="inline-flex items-center gap-2 px-4 py-2 bg-amber-500 text-white text-sm font-medium rounded-lg hover:bg-amber-600 transition shadow-md hover:shadow-lg">
        <i class="fas fa-eye-slash"></i>Ocultas
      </a>
      <a href="{% url 'empleos_app:empleos-guardados' %}"
         class="inline-flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition shadow-md hover:shadow-lg">
        <i class="fas fa-bookmark"></i>Guardados
      </a>
    </div>
  </div>

  <form method="POST" action="{% url 'empleos_app:resultados-empleos' %}" id="empleos-search-form" class="bg-white rounded-2xl shadow-lg p-6 space-y-5">
    {% csrf_token %}

    <div class="bg-slate-50 rounded-xl p-4 space-y-4">
      <h2 class="text-sm font-semibold text-slate-600 uppercase tracking-wide">
        <i class="fas fa-filter mr-1"></i>Filtros de búsqueda
      </h2>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Palabras clave</label>
        <input type="text" name="search" placeholder="Ej: python developer"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        <div id="keywords-history" class="flex flex-wrap items-center gap-2 mt-2"></div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">País</label>
          <select name="country_id" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="1">Perú</option>
            <option value="2">México</option>
            <option value="3">Colombia</option>
            <option value="4">Chile</option>
            <option value="5">Argentina</option>
            <option value="6">España</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Antigüedad</label>
          <select name="from_age" class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            <option value="">Cualquier fecha</option>
            <option value="1" selected>Último día</option>
            <option value="3">Últimos 3 días</option>
            <option value="7">Última semana</option>
            <option value="30">Último mes</option>
          </select>
        </div>
        <div>
          <label for="max_pages" class="block text-sm font-medium text-slate-700 mb-1">Máximo de páginas</label>
          <input type="number" id="max_pages" name="max_pages" value="3" min="1" max="10"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Nivel</label>
        <div class="flex flex-wrap gap-3">
          <label class="flex items-center gap-1.5 text-sm text-slate-600">
            <input type="checkbox" name="job_seniority" checked  value="1" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Prácticas
          </label>
          <label class="flex items-center gap-1.5 text-sm text-slate-600">
            <input type="checkbox" name="job_seniority" checked  value="2" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Junior
          </label>
          <label class="flex items-center gap-1.5 text-sm text-slate-600">
            <input type="checkbox" name="job_seniority" checked  value="3" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Semi Senior
          </label>
          <label class="flex items-center gap-1.5 text-sm text-slate-600">
            <input type="checkbox" name="job_seniority" value="4" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500"> Senior
          </label>
        </div>
      </div>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
      <i class="fas fa-search mr-2"></i>Buscar ofertas
    </button>
  </form>
</div>
{% endblock sidebar_content %}

{% block js %}
<script>
  (function () {
    var KEY = "empleos_keywords_history";
    var MAX = 10;
    var input = document.querySelector('input[name="search"]');
    var container = document.getElementById("keywords-history");
    var form = document.getElementById("empleos-search-form");

    function getHistory() {
      try {
        var raw = JSON.parse(localStorage.getItem(KEY));
        return Array.isArray(raw) ? raw.filter(function (k) { return typeof k === "string" && k.trim(); }) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(list) {
      localStorage.setItem(KEY, JSON.stringify(list));
    }

    function renderChips() {
      container.innerHTML = "";
      var history = getHistory();
      if (!history.length) {
        container.classList.add("hidden");
        return;
      }
      container.classList.remove("hidden");

      var label = document.createElement("span");
      label.className = "text-xs text-slate-400";
      label.textContent = "Recientes:";
      container.appendChild(label);

      history.forEach(function (kw) {
        var chip = document.createElement("span");
        chip.className = "inline-flex items-center rounded-full bg-blue-50 border border-blue-100 overflow-hidden";

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pl-3 pr-1.5 py-1 text-xs font-medium text-blue-600 hover:bg-blue-100 transition";
        btn.textContent = kw;
        btn.title = "Usar esta búsqueda";
        btn.addEventListener("click", function () {
          input.value = kw;
          input.focus();
        });

        var del = document.createElement("button");
        del.type = "button";
        del.className = "pl-1 pr-2.5 py-1 text-blue-300 hover:text-red-500 transition";
        del.innerHTML = '<i class="fas fa-times text-[10px]"></i>';
        del.title = "Eliminar del historial";
        del.setAttribute("aria-label", "Eliminar " + kw);
        del.addEventListener("click", function () {
          saveHistory(getHistory().filter(function (k) { return k.toLowerCase() !== kw.toLowerCase(); }));
          renderChips();
        });

        chip.appendChild(btn);
        chip.appendChild(del);
        container.appendChild(chip);
      });
    }

    if (form) {
      form.addEventListener("submit", function () {
        var kw = input.value.trim();
        if (!kw) return;
        var history = getHistory().filter(function (k) { return k.toLowerCase() !== kw.toLowerCase(); });
        history.unshift(kw);
        saveHistory(history.slice(0, MAX));
      });
    }

    renderChips();
  })();
</script>
{% endblock js %}
